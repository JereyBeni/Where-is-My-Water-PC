name: CI

on:
  pull_request:
  push:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release

  pc-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install SDL2 + SDL2_image (vcpkg)
        run: |
          vcpkg install sdl2:x64-windows sdl2-image:x64-windows
          vcpkg integrate install

      - name: Configure CMake (Ninja / x64 / Release)
        working-directory: pc
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        working-directory: pc
        run: cmake --build build --config Release --parallel

      - name: Verify PE machine type (x64)
        working-directory: pc/build
        shell: pwsh
        run: |
          if (-not (Test-Path "wmw_pc.exe")) {
            Write-Error "wmw_pc.exe not found in pc/build"
            Get-ChildItem -Recurse | Select-Object FullName
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes("wmw_pc.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("PE Machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0x8664) {
            Write-Error "Binary is not x64 PE (Machine=$machine)"
            exit 1
          }
          Write-Host "OK: x64 PE confirmed"

      - name: Stage package
        shell: pwsh
        run: |
          $out = "dist/wmw-pc-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = "pc/build/wmw_pc.exe"
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem -Path "pc/build" -Recurse -Filter wmw_pc.exe | Select-Object -First 1 -ExpandProperty FullName
          }
          Copy-Item $exe "$out/wmw_pc.exe"

          # Runtime DLLs from vcpkg
          $bin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin"
          foreach ($dll in @("SDL2.dll", "SDL2_image.dll", "libpng16.dll", "zlib1.dll")) {
            $p = Join-Path $bin $dll
            if (Test-Path $p) { Copy-Item $p $out }
            else {
              $found = Get-ChildItem -Path $env:VCPKG_INSTALLATION_ROOT -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { Copy-Item $found.FullName $out }
              elseif ($dll -eq "SDL2.dll" -or $dll -eq "SDL2_image.dll") {
                Write-Error "$dll not found"; exit 1
              }
            }
          }

          # Copyright splash image (must sit next to exe)
          Copy-Item "pc/Drawing.png" "$out/Drawing.png"

          Copy-Item -Recurse "app/src/main/assets" "$out/assets"
          & "tools/strip_allie_cranky.ps1" -AssetsRoot "$out/assets"
          & "tools/optimize_shared_assets.ps1" -AssetsRoot "$out/assets"

          @"
          @echo off
          cd /d "%~dp0"
          wmw_pc.exe assets 01_CUT_FIRST
          pause
          "@ | Set-Content -Encoding ASCII "$out/run.bat"

          Copy-Item "pc/README.md" "$out/README.md"
          Copy-Item "pc/ARCHITECTURE.md" "$out/ARCHITECTURE.md"

          Compress-Archive -Path "$out\*" -DestinationPath "dist/wmw-pc-windows-x64.zip" -Force
          $zipSize = [math]::Round((Get-Item "dist/wmw-pc-windows-x64.zip").Length / 1MB, 2)
          Write-Host "Packaged dist/wmw-pc-windows-x64.zip ($zipSize MB)"

      - name: Upload Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wmw-pc-windows-x64
          path: dist/wmw-pc-windows-x64.zip
