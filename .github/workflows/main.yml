name: CI

on:
  pull_request:
  push:

jobs:
  # ---------------------------------------------------------------------------
  # Android (original)
  # ---------------------------------------------------------------------------
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug

  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release

  # ---------------------------------------------------------------------------
  # PC Port (SDL2 + CMake)
  # ---------------------------------------------------------------------------
  pc-port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev zip

      - name: Configure CMake
        working-directory: pc
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: pc/build
        run: cmake --build . --config Release -j$(nproc)

      - name: Package PC port ZIP
        run: |
          mkdir -p dist/wmw-pc
          cp pc/build/wmw_pc dist/wmw-pc/
          # Original assets live here — keep them outside pc/src
          cp -r app/src/main/assets dist/wmw-pc/assets
          # Small run helper
          cat > dist/wmw-pc/run.sh << 'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          ./wmw_pc ./assets
          EOF
          chmod +x dist/wmw-pc/run.sh dist/wmw-pc/wmw_pc
          cd dist
          zip -r wmw-pc-port.zip wmw-pc

      - name: Upload PC Port ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wmw-pc-port
          path: dist/wmw-pc-port.zip
